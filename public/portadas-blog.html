  ];
  var FB = window.BB_FB;
  if (!FB) { log("Falta la configuraci&#243;n de Firebase.", "err"); return; }
  await FB.ready;
  if (!FB.esAdmin()) { log("Primero ingres&#225; al <a href=\"login.html\">panel de administraci&#243;n</a> con tu usuario y despu&#233;s volv&#233; a abrir esta p&#225;gina.", "err"); return; }
  log("Sesi&#243;n de administrador: " + FB.auth.currentUser.email);
  var v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto";
  v.src = v.canPlayType('video/webm; codecs="vp9"') ? "assets/hero.webm" : "assets/hero.mp4";
  await new Promise(function(ok, no){ v.addEventListener("loadeddata", ok, {once: true}); v.addEventListener("error", function(){ no(new Error("no se pudo cargar el video")); }, {once: true}); });
  var W = 1200, H = 675, cv = document.createElement("canvas"); cv.width = W; cv.height = H; var cx = cv.getContext("2d");
  function svgImg(s){ return new Promise(function(ok, no){ var im = new Image(); im.onload = function(){ ok(im); }; im.onerror = no; im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s); }); }
  for (var q = 0; q < COVERS.length; q++) COVERS[q].img = await svgImg(COVERS[q].svg);
  /* se reproduce el video (sin sonido) y se toma el cuadro cuando llega a cada segundo elegido */
  v.playbackRate = 2;
  try { await v.play(); } catch (e) { log("Toc&#225; la p&#225;gina para continuar&#8230;"); await new Promise(function(ok){ addEventListener("click", ok, {once: true}); }); await v.play(); }
  function llegar(t){ return new Promise(function(ok, no){ var tope = setTimeout(function(){ no(new Error("el video no avanz&#243;")); }, 30000); (function mirar(){ if (v.currentTime >= t) { clearTimeout(tope); ok(); } else requestAnimationFrame(mirar); })(); }); }
  var hechas = 0;
  COVERS.sort(function(a, b){ return a.t - b.t; });
  var fotos = [];
  for (var i = 0; i < COVERS.length; i++) {
    var c = COVERS[i];
    try {
      await llegar(c.t);
      var iw = v.videoWidth, ih = v.videoHeight, s = Math.max(W / iw, H / ih), fw = iw * s, fh = ih * s;
      cx.filter = "saturate(1.05) contrast(1.03)";
      cx.drawImage(v, (W - fw) * c.px, (H - fh) * c.py, fw, fh);
      cx.filter = "none";
      cx.drawImage(c.img, 0, 0, W, H);
      fotos.push({id: c.id, foto: cv.toDataURL("image/jpeg", 0.8)});
    } catch (e) { log("No se pudo generar " + c.id + ": " + (e.message || e), "err"); }
  }
  v.pause();
  for (var j = 0; j < fotos.length; j++) {
    try {
      await FB.fs.collection("blog").doc(fotos[j].id).set({foto: fotos[j].foto}, {merge: true});
      var im = document.createElement("img"); im.src = fotos[j].foto; im.alt = fotos[j].id; prev.appendChild(im);
      log("Portada cargada: " + fotos[j].id, "ok"); hechas++;
    } catch (e) { log("No se pudo cargar " + fotos[j].id + ": " + (e.code || e.message || e), "err"); }
  }
  if (hechas === COVERS.length) log("Listo. <a href=\"blog.html\">Ver el blog &#8594;</a>", "ok");
